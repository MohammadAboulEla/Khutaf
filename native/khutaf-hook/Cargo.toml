[package]
name = "khutaf-hook"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "khutaf_hook"
crate-type = ["cdylib"]

[dependencies]
khutaf-proto = { path = "../khutaf-proto" }
minhook = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Registry", "Win32_Security"] }
