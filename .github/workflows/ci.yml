name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  go-and-frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Run Rust tests
        run: cargo test --manifest-path native/Cargo.toml

      - name: Run clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings

  linux-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet on non-Windows packages
        run: go vet ./internal/arabic ./internal/config ./internal/hook ./internal/pipeline ./internal/translator/...

      - name: Run Go tests on Linux
        run: go test -race -count=1 ./internal/arabic ./internal/config ./internal/hook ./internal/pipeline ./internal/translator/...
